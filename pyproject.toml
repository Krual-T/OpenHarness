[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openharness"
version = "0.2.3"
description = "Agent-first repository scaffold and workflow harness for Codex."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0,<7",
    "tomli-w>=1.0,<2",
    "typer>=0.15,<1",
]

[project.scripts]
openharness = "openharness_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
include = ["openharness", "openharness.*", "openharness_cli", "openharness_cli.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
