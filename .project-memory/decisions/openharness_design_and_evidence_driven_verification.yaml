intent_aliases:
- TDD 是否适用于所有任务
- pytest 是否是 OpenHarness 默认主验证
- 协议修改是否要写 pytest
tags:
- verification
- tdd
- protocol
- decision
alternatives:
- 所有任务默认先写 pytest 或 TDD
- 非代码任务只靠人工判断且不记录 fresh evidence
consequences:
- 详细设计需要先明确实现设计、验证对象和证据路径；非自动测试任务需要记录协议审查、dry run、人工复核或 runtime 证据。
revisit_when:
- 当 OpenHarness 增加可重复 agent dry run harness 或重新定义 task package 验证阶段时重新评估
question: OpenHarness 是否应把 TDD / pytest-first 作为所有任务的默认流程
decision: 不采用全局 pytest-first；先完成 task package 的 overview 和 detailed design，再按验证对象选择
  TDD、协议审查、dry run、runtime workflow、人工复核或结构检查。TDD 只作为适合可执行行为和可观察代码契约的实现内循环。
rationale: OH-043 证明文档语义、协作协议、skill 行为和 agent 工作流不能靠形式主义 pytest 断言充分验证；但代码类行为仍应保留
  TDD / 自动测试纪律。
