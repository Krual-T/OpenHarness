    tests/openharness_cases/test_protocol_docs.py -q
  - uv run openharness check-tasks
  required_scenarios:
  - 未配置默认模式时，`openharness update` 仍执行普通 `git pull` 路径。
  - 配置默认模式为 `force-sync` 后，无参数 `openharness update` 执行强制同步路径。
  - 单次 `--mode pull` 或 `--force-sync` 覆盖保存的默认模式。
