done_criteria:
- '`openharness update` defaults to the configured update mode when no one-shot mode
  option is provided.'
- Users can set the default update mode to `pull` or `force-sync` through the update
  command.
- One-shot options still override the saved default mode.
- Invalid configured modes fail visibly and do not run update commands.
