  openharness` behavior.'
- '`openharness update --force-sync` force-synchronizes the OpenHarness source clone
  before refreshing the installed CLI.'
- Force-sync behavior is covered by automated tests for parser output, command ordering,
  and failure interruption.
- Help and install-facing docs make the destructive nature of force sync visible.
