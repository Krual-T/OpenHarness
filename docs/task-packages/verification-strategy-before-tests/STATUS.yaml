- docs/task-packages/verification-strategy-before-tests/02-overview-design.md
- docs/task-packages/verification-strategy-before-tests/03-detailed-design.md
done_criteria:
- 明确 OpenHarness 的默认工作流应先在 detailed design 中设计验证策略，再决定是否写自动测试。
- 明确 TDD 只适用于可执行行为、代码逻辑、CLI 行为、解析器、校验器等适合自动测试的对象。
- 明确文档语义、协作协议、skill 行为规则、人工 runtime 观察等场景可以采用协议审查、子智能体 dry run、runtime workflow 或人工场景验证。
- 明确不再把“先写 pytest”作为所有任务的默认形式化要求。
- 更新相关 skills 与 writing guidance，使 agent 能根据验证对象选择合适证据路径。
