id: <DESIGN_ID>
title: <TITLE>
# Default flow: proposing -> requirements_designed -> overview_designing -> overview_designed -> detailed_designing -> detailed_designed -> implementing -> implemented -> verifying -> archived
# Each designing/designed pair marks a design checkpoint; later statuses imply earlier checkpoints are already materially complete.
# `detailed_designed` is the normal resting point for design-complete work before implementation.
# `archived` means the task package is implemented, verified, and no longer active.
# If a sentence here contains backticks or other YAML-sensitive punctuation, wrap the whole sentence in double quotes.
# Example: summary: "`02-overview-design.md` guidance: explain the boundary."
status: <STATUS>
summary: <SUMMARY>
owner: <OWNER>
created_at: <DATE>
updated_at: <DATE>
depends_on: []
scope:
  areas: []
# Optional collaboration state. Write these only after the human confirms the value.
# task_type: mechanical | standard development | protocol/architecture
# design_review_mode: stepwise | auto
collaboration: {}
entrypoints:
  - docs/task-packages/<DESIGN_NAME>/README.md
  - docs/task-packages/<DESIGN_NAME>/01-requirements.md
  - docs/task-packages/<DESIGN_NAME>/02-overview-design.md
  - docs/task-packages/<DESIGN_NAME>/03-detailed-design.md
done_criteria:
  - Replace this placeholder with real done criteria.
