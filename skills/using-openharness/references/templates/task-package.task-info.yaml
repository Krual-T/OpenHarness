id: <TASK_ID>
title: <TITLE>
# 状态流转（mechanical）：
#   proposing -> requirements_designed[G] -> verification_designing -> verification_designed[G] -> implementing -> implemented[G] -> verifying -> verified[G] -> archived
# 状态流转（standard / protocol）：
#   proposing -> overview_designing -> overview_designed[G] -> detailed_designing -> detailed_designed[G] -> verification_designing -> verification_designed[G] -> implementing -> implemented[G] -> verifying -> verified[G] -> archived
# [G] = 门禁状态，CLI 自动推进。
status: <STATUS>
summary: <SUMMARY>
owner: <GIT OWNER>
# ⚠ owner 和 created_at 由 CLI 自动注入（owner 取自 git config user.name），禁止手动修改。
created_at: <DATE>
updated_at: <DATE>
# collaboration 在人工确认后再填写。
#   task_type: mechanical | standard development | protocol/architecture
#   design_review_mode: stepwise | auto
collaboration:
  task_type: < mechanical | standard development | protocol/architecture >
  design_review_mode: <stepwise|auto>
verification:
  verify_by: < unit_test | qualitative | rwp >
